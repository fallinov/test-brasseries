<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brasseries de Suisse</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="libs/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">

<body class="app">
  <header class="app-header">
    <h1 class="app-header__title">Brasseries de Suisse</h1>

      type="search"

  <footer class="app-footer">Chargement des brasseries…</footer>

  <script src="libs/leaflet/leaflet.js"></script>
  <script src="main.js"></script>

</html>
